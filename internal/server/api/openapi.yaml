openapi: 3.0.3
info:
  title: Raccoon CI server API
  version: "0.1"
  description: |
    The server's API (draft). Every /v1 route except this file needs
    `Authorization: Bearer <token>`. A token has a role: `read` reads runs, jobs,
    logs and events; `admin` also starts, cancels and repeats runs and manages
    secrets, variables and tokens (403 for a read token). The bootstrap token the
    server is started with is an admin token; others are made through
    `POST /v1/tokens`. With no way to tell tokens apart the API is closed (503).
paths:
  /healthz:
    get:
      summary: Liveness, no authentication
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  version: {type: string}
  /v1/openapi.yaml:
    get:
      summary: This file, no authentication
      responses:
        "200":
          description: the OpenAPI description
          content:
            application/yaml:
              schema: {type: string}
  /v1/runs:
    get:
      summary: Runs, newest first
      parameters:
        - {name: repo, in: query, schema: {type: string}, description: "owner/name"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: before, in: query, schema: {type: integer}, description: "only runs with a smaller id; pass next_before of the previous page"}
      responses:
        "200":
          description: a page of runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: {$ref: "#/components/schemas/Run"}
                  next_before: {type: integer, description: "0 on the last page"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    post:
      summary: Start a workflow by hand (workflow_dispatch)
      description: |
        Runs the workflow file at the commit `ref` names now. The workflow must
        have a `workflow_dispatch` trigger; `inputs` are checked against the ones
        it declares (defaults filled, required ones needed, choices checked).
        `ref` is a branch name or a full ref (`refs/tags/v1`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, ref, workflow]
              properties:
                repo: {type: string, description: "owner/name"}
                ref: {type: string}
                workflow: {type: string, description: ".github/workflows/ci.yml"}
                inputs: {type: object, additionalProperties: {type: string}}
      responses:
        "201":
          description: the queued run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/secrets:
    get:
      summary: The names of the secrets of a scope (never their values)
      description: Needs the admin role, like everything about secrets. A scope is `org:<name>` or `repo:<owner>/<name>`, in lower case. A run gets the secrets its workflow names literally (`secrets.NAME`), the repository's over the organization's; a pull request from a fork gets none.
      parameters:
        - {name: scope, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: the secrets
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        updated_at: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    put:
      summary: Make or replace a secret
      description: The value is sealed before it is stored and cannot be read back. Names are kept in capitals; names starting with GITHUB_ are reserved; a value is 1 to 49152 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SecretBody"}
      responses:
        "204": {description: stored}
        "400": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete a secret
      parameters:
        - {name: scope, in: query, required: true, schema: {type: string}}
        - {name: name, in: query, required: true, schema: {type: string}}
      responses:
        "204": {description: deleted}
        "404": {$ref: "#/components/responses/Error"}
  /v1/vars:
    get:
      summary: The variables of a scope, with their values
      parameters:
        - {name: scope, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: the variables
          content:
            application/json:
              schema:
                type: object
                properties:
                  vars:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        value: {type: string}
                        updated_at: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/Error"}
    put:
      summary: Make or replace a variable
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SecretBody"}
      responses:
        "204": {description: stored}
        "400": {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete a variable
      parameters:
        - {name: scope, in: query, required: true, schema: {type: string}}
        - {name: name, in: query, required: true, schema: {type: string}}
      responses:
        "204": {description: deleted}
        "404": {$ref: "#/components/responses/Error"}
  /v1/storage:
    get:
      summary: Where an organization's artifacts and caches go (never its keys)
      description: |
        `org=*` is the server's own bucket, the one organizations without a bucket of their own use. It is saved like an organization's (tried first, sealed under the master key) and wins over the bucket the server was started with.
      parameters:
        - {name: org, in: query, required: true, schema: {type: string}, description: "an organization, or * for the server's own"}
      responses:
        "200":
          description: "`configured` is false while the organization uses the server's own storage"
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: {type: boolean}
                  endpoint: {type: string}
                  region: {type: string}
                  bucket: {type: string}
                  prefix: {type: string}
                  path_style: {type: boolean}
        "400": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    put:
      summary: Give an organization its own bucket (R2, S3, any S3-compatible store)
      description: |
        The bucket is tried first: an object is written, read back through a
        presigned link and deleted; settings of a bucket that does not work are
        not saved (400, with the step that failed). A bucket that gives its
        objects to anyone without credentials is saved, with a warning. The keys
        are sealed and never read back. Objects already in another bucket stay
        there; new artifacts and caches go to this one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org, bucket, access_key, secret_key]
              properties:
                org: {type: string}
                bucket: {type: string}
                endpoint: {type: string, description: "https; empty for AWS. R2: https://<account id>.r2.cloudflarestorage.com"}
                region: {type: string, description: "R2: auto"}
                prefix: {type: string}
                path_style: {type: boolean}
                access_key: {type: string}
                secret_key: {type: string}
      responses:
        "200":
          description: saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  warnings:
                    type: array
                    items: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    delete:
      summary: Go back to the server's own storage
      parameters:
        - {name: org, in: query, required: true, schema: {type: string}}
      responses:
        "204": {description: removed}
        "404": {$ref: "#/components/responses/Error"}
  /v1/tokens:
    get:
      summary: The API tokens (never the tokens themselves)
      responses:
        "200":
          description: the tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items: {$ref: "#/components/schemas/Token"}
    post:
      summary: Make a token
      description: |
        The token is in the answer once; only a hash of it is kept. `read` can read runs, jobs, logs, artifacts and events; `admin` can also change anything and manage secrets and tokens.
        A `read` token can be limited with `repos` (`owner/name` or `owner/*`, not case sensitive, at most 100): it then sees only the runs and events of those repositories. A run or event of another repository answers 404, the same as one that does not exist, and the list leaves them out. A limited token cannot use any other route (403). An `admin` token cannot be limited (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: {type: string}
                role: {type: string, enum: [read, admin]}
                repos:
                  type: array
                  items: {type: string, example: "acme/*"}
                  description: the repositories a read token is limited to; omit for all
      responses:
        "201":
          description: the token, shown once
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Token"}
                  - type: object
                    properties:
                      token: {type: string}
        "400": {$ref: "#/components/responses/Error"}
  /v1/tokens/{id}:
    delete:
      summary: Revoke a token; it stops working at once
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "204": {description: revoked}
        "404": {$ref: "#/components/responses/Error"}
  /v1/runs/{id}/cancel:
    post:
      summary: Cancel a queued or running run
      description: A queued run ends at once (200); a running one is told to stop and ends a moment later as cancelled (202).
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200": {description: "a queued run, cancelled"}
        "202": {description: "a running run, told to stop"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/runs/{id}/rerun:
    post:
      summary: Run a finished run again
      description: A new queued run with the same event, commit, workflow file (as it was) and inputs; its `rerun_of` names the run that started the chain.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "201":
          description: the new run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/runs/{id}/jobs:
    get:
      summary: The job instances of a run (a matrix job has one per combination)
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: the jobs, in the order they started
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        status: {type: string, enum: [in_progress, completed]}
                        conclusion: {type: string}
                        started_at: {type: string, format: date-time}
                        completed_at: {type: string, format: date-time}
        "404": {$ref: "#/components/responses/Error"}
  /v1/runs/{id}/artifacts:
    get:
      summary: The finished artifacts of a run
      description: What the run's `upload-artifact` steps stored. Kept until `expires_at` (90 days unless the step asks for less; the server may cap it), then deleted.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: the artifacts, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        job: {type: string, description: "the job instance that uploaded it"}
                        size: {type: integer, description: "bytes, as stored (the zip)"}
                        digest: {type: string, description: "the client's sha256, recorded and not verified"}
                        created_at: {type: string, format: date-time}
                        expires_at: {type: string, format: date-time}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/runs/{id}/artifacts/{artifact}/download:
    get:
      summary: Download an artifact
      description: Redirects (302) to a link that works for an hour and goes straight to the storage. Not cacheable.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: artifact, in: path, required: true, schema: {type: integer}}
      responses:
        "302": {description: the link is in the Location header}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/runs/{id}/log:
    get:
      summary: The log of a run
      description: |
        One ordered stream of events per run. Each line has an `id` that grows
        with the order; ask again with `after=<next_after>`. With
        `Accept: text/event-stream` the log is sent as server-sent events (the
        line's id is the event id, so `Last-Event-ID` resumes) until an `end`
        event, which carries the run's conclusion.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: after, in: query, schema: {type: integer, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 5000, default: 500}}
      responses:
        "200":
          description: a page of the log
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        at: {type: string, format: date-time}
                        event: {$ref: "#/components/schemas/LogEvent"}
                  next_after: {type: integer}
                  done: {type: boolean, description: "the run has ended and nothing is left after next_after"}
            text/event-stream:
              schema: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "410": {description: "the log was deleted after the retention time (`log_purged` on the run); the body is the usual error object"}
  /v1/runs/{id}:
    get:
      summary: One run, with the workflow file it started from
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: the run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/auth/github/login:
    get:
      summary: Start signing in with GitHub
      description: |
        Sends the browser to GitHub (302) and sets a short-lived cookie that ties the sign-in to this browser. `redirect` says where to go afterwards: it must start with one of the addresses the server was given (`-auth-redirect`), and the session then arrives in the URL's fragment (`#token=…&expires_at=…&user=…&role=…`), never the query. Without `redirect` the callback answers with the session as JSON. 503 when signing in is not set up. Needs no token.
      parameters:
        - {name: redirect, in: query, required: false, schema: {type: string}}
      responses:
        "302": {description: to GitHub}
        "400": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/auth/github/callback:
    get:
      summary: Where GitHub sends the browser back to
      description: |
        Finishes the sign-in: checks the state and the cookie, trades the code for the user's own GitHub token, learns who the user is and which repositories of the App's installations they can reach, revokes that token, and makes a session: a `read` token limited to exactly those repositories that expires after 12 hours (`-auth-session-hours`). A login listed in `-auth-admins` gets an `admin` session instead. Someone who reaches no repository gets 403 and no session. This address must be the App's callback URL. Needs no token.
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
      responses:
        "200":
          description: the session (when no redirect was asked for)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  user: {type: string}
                  role: {type: string, enum: [read, admin]}
                  expires_at: {type: string, format: date-time}
                  repos: {type: array, items: {type: string}}
        "302": {description: to the redirect asked for, with the session in the fragment}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/auth/me:
    get:
      summary: Who the token is
      description: "`kind` is `session` (signed in with GitHub), `api` (made through `/v1/tokens`) or `bootstrap`. A repository-limited token may call this."
      responses:
        "200":
          description: the token
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: {type: string, enum: [session, api, bootstrap]}
                  user: {type: string}
                  name: {type: string}
                  role: {type: string, enum: [read, admin]}
                  repos: {type: array, items: {type: string}}
                  expires_at: {type: string, format: date-time}
  /v1/auth/logout:
    post:
      summary: End the token it is called with
      responses:
        "204": {description: signed out}
        "400": {$ref: "#/components/responses/Error"}
  /v1/usage:
    get:
      summary: The machine time used in a month
      description: |
        Machine time is how long job instances held machines, start-up included; it is what the monthly allowances (`quota`) are counted against. `month` is a UTC month like `2026-11` (the current one by default). `repos` is per repository over the month, `days` per day and repository. A token limited to repositories sees only theirs.
      parameters:
        - {name: month, in: query, required: false, schema: {type: string, example: "2026-11"}}
      responses:
        "200":
          description: the usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: {type: string}
                  quota:
                    type: object
                    description: "minutes per month; 0 is no allowance"
                    properties:
                      repo_minutes: {type: integer}
                      owner_minutes: {type: integer}
                  repos:
                    type: array
                    items: {$ref: "#/components/schemas/Usage"}
                  days:
                    type: array
                    items: {$ref: "#/components/schemas/Usage"}
        "400": {$ref: "#/components/responses/Error"}
  /v1/installations:
    get:
      summary: Where the GitHub App is installed
      description: |
        What the App's own installation events told the server: the accounts it is installed on, whether on all their repositories or on selected ones (then listed), and whether an installation is suspended. Not available to a token limited to repositories (403).
      responses:
        "200":
          description: the installations
          content:
            application/json:
              schema:
                type: object
                properties:
                  installations:
                    type: array
                    items: {$ref: "#/components/schemas/Installation"}
  /v1/events/{id}:
    get:
      summary: One webhook delivery and what was decided for it (not its payload)
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: the event
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Event"}
        "404": {$ref: "#/components/responses/Error"}
components:
  responses:
    Error:
      description: an error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
  schemas:
    Run:
      type: object
      properties:
        id: {type: integer}
        event_id: {type: integer}
        repo: {type: string}
        workflow_path: {type: string}
        workflow_name: {type: string}
        event: {type: string, description: "push, pull_request, ..."}
        ref: {type: string}
        sha: {type: string}
        base_sha: {type: string}
        pull_request: {type: integer}
        rerun_of: {type: integer, description: "the run this repeats; absent for a run an event started"}
        log_purged: {type: boolean, description: "the run's log was deleted after the retention time (the log routes answer 410); the run, its jobs and its result stay"}
        attempts: {type: integer, description: "how many times the server took the run; 2 or more means it was started again from the beginning after the server stopped; absent while queued for the first time"}
        fork: {type: boolean, description: "a pull request from another repository: no secrets"}
        actor: {type: string}
        status: {type: string, enum: [queued, in_progress, completed]}
        conclusion: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        workflow: {type: string, description: "only in the detail"}
    SecretBody:
      type: object
      required: [scope, name, value]
      properties:
        scope: {type: string, description: "org:<name> or repo:<owner>/<name>"}
        name: {type: string}
        value: {type: string}
    Token:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        role: {type: string, enum: [read, admin]}
        repos: {type: array, items: {type: string}, description: "the repositories a read token is limited to; absent for all"}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    LogEvent:
      type: object
      properties:
        kind:
          type: string
          enum: [job_started, step_started, output, debug, notice, warning, error, group_start, group_end, step_finished, job_finished, unknown]
        time: {type: string, format: date-time}
        job: {type: string, description: "the job instance the line belongs to; empty for the run itself"}
        step: {type: string}
        depth: {type: integer, description: "1 inside a composite action"}
        text: {type: string}
        props: {type: object, additionalProperties: {type: string}, description: "an annotation's file, line, title"}
        conclusion: {type: string}
    Usage:
      type: object
      properties:
        day: {type: string, description: "UTC date; absent in the per-repository totals"}
        repo: {type: string}
        machine_seconds: {type: integer}
        runs: {type: integer}
    Installation:
      type: object
      properties:
        id: {type: integer, description: "GitHub's installation id"}
        account: {type: string}
        account_type: {type: string, description: "User or Organization"}
        repository_selection: {type: string, enum: [all, selected]}
        suspended: {type: boolean}
        repos: {type: array, items: {type: string}, description: "the repositories GitHub listed, lower case; empty for an installation on all repositories that was never listed"}
        updated_at: {type: string, format: date-time}
    Event:
      type: object
      properties:
        id: {type: integer}
        delivery_id: {type: string}
        kind: {type: string}
        action: {type: string}
        repo: {type: string}
        received_at: {type: string, format: date-time}
        status: {type: string, enum: [received, handled, ignored, failed]}
        note: {type: string, description: "JSON text: per workflow file, run / skipped / invalid; or why it failed"}
